[package]
name = "braupause-editor"
version = "0.1.0"
edition = "2024"
description = "Desktop-Editor für die Sud-Dateien (batches/*.json) der Braupause inkl. Validierung, Commit & Push"
publish = false

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37.0"
egui_extras = { version = "0.37", features = ["file", "image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif"] }
jsonschema = { version = "0.61.2", default-features = false }
rfd = "0.18.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
trash = "5.3.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
